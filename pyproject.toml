[project]
name = "mocap-yt"
version = "0.1.0"
description = "Motion capture from YouTube videos: asset extraction + MocapAnything (V2) inference pipeline, CPU-only"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # --- deep learning (CPU-only wheels, see [tool.uv.sources]) ---
    "torch==2.9.0",
    "torchvision==0.24.0",
    "transformers>=5.22,<6",  # SAM 2 (subject: person_sam)
    "huggingface-hub>=0.26",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "protobuf>=4",
    # --- numerics / geometry ---
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "roma>=1.5",
    "trimesh>=4.4",
    "pygltflib>=1.16",
    # --- media ---
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.8",
    "yt-dlp>=2025.1.1",
    # --- misc ---
    "pyyaml>=6",
    "tqdm>=4.66",
    "einops>=0.8",
]

[project.scripts]
mocap-yt = "mocap_yt.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mocap_yt"]

# CPU-only PyTorch: torch/torchvision resolve exclusively from the PyTorch CPU index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# Make sure the lockfile carries the "+cpu" x86_64 Linux wheels.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
